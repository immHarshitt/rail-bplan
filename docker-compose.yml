services:
  postgres:
    image: postgres:15-alpine
    container_name: railopt-db
    environment:
      POSTGRES_USER: railopt
      POSTGRES_PASSWORD: railopt_dev
      POSTGRES_DB: railopt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railopt"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
